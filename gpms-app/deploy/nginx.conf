# Reverse proxy in front of the GPMS container (TLS terminates here).
server {
    listen 443 ssl http2;
    server_name gpms.example.com;            # replace with the MARS domain

    ssl_certificate     /etc/ssl/gpms/fullchain.pem;
    ssl_certificate_key /etc/ssl/gpms/privkey.pem;

    client_max_body_size 60m;                # 10 attachments x 5 MB + form data

    add_header Strict-Transport-Security "max-age=31536000" always;

    location / {
        proxy_pass http://127.0.0.1:4000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name gpms.example.com;
    return 301 https://$host$request_uri;
}
