name: CI
on:
  push:
  pull_request:

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Backend tests (embedded PostgreSQL)
        working-directory: backend
        run: |
          npm ci
          npm test
      - name: Frontend build
        working-directory: frontend
        run: |
          npm ci
          npm run build
      - name: Docker image builds
        run: docker build -t gpms:ci .
