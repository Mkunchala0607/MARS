# Production-like stack: PostgreSQL 18 + GPMS app. Put secrets in a .env file next to this file.
services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: gpms
      POSTGRES_USER: gpms_app
      POSTGRES_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gpms_app -d gpms"]
      interval: 10s
      retries: 5

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://gpms_app:${DB_PASSWORD}@db:5432/gpms
      JWT_SECRET: ${JWT_SECRET:?set JWT_SECRET in .env}
      APP_URL: ${APP_URL:-http://localhost:4000}
      CORS_ORIGIN: ${APP_URL:-http://localhost:4000}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
    ports:
      - "4000:4000"
    volumes:
      - uploads:/app/uploads

volumes:
  pgdata:
  uploads:
